<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>子账号管理</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="add()">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        新增
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="sub-account-page">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content pullingText="下拉刷新" refreshingSpinner="crescent" refreshingText="正在刷新"></ion-refresher-content>
  </ion-refresher>

  <section class="page-intro">
    <div class="intro-icon">
      <ion-icon name="people-outline"></ion-icon>
    </div>
    <div>
      <h1>管理子账号</h1>
      <p>为团队成员维护登录账号，便于协同查询和业务操作。</p>
    </div>
  </section>

  <section class="account-list skeleton-list" *ngIf="isLoading && items.length === 0" aria-label="加载中">
    <ion-card class="account-card ion-no-margin" *ngFor="let item of [1,2,3]">
      <ion-card-content>
        <ion-skeleton-text animated class="skeleton-avatar"></ion-skeleton-text>
        <div>
          <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        </div>
      </ion-card-content>
    </ion-card>
  </section>

  <section class="state-wrap" *ngIf="isLoaded && loadError && items.length === 0">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <h2>子账号加载失败</h2>
    <p>网络可能不稳定，请稍后重试。</p>
    <ion-button fill="outline" size="small" (click)="getList()">重新加载</ion-button>
  </section>

  <section class="state-wrap" *ngIf="isLoaded && !loadError && items.length === 0">
    <ion-icon name="person-add-outline"></ion-icon>
    <h2>还没有子账号</h2>
    <p>新增子账号后，团队成员可以独立登录使用。</p>
    <ion-button size="small" (click)="add()">新增子账号</ion-button>
  </section>

  <section class="account-list" *ngIf="items.length > 0">
    <ion-card class="account-card ion-no-margin" button *ngFor="let item of items; trackBy: trackByObjectId" (click)="detail(item)">
      <ion-card-content>
        <span class="avatar">{{getContactName(item).slice(0, 1)}}</span>
        <ion-label>
          <h2>{{getContactName(item)}}</h2>
          <p>{{item.MobilePhone || '未设置手机号'}}</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
