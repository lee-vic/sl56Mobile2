<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>支付结算</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="payment-content">
  <!-- Skeleton loading -->
  <ng-container *ngIf="isLoading">
    <div class="skeleton-page">
      <ion-skeleton-text animated style="width: 50%; height: 24px; margin-bottom: 12px;"></ion-skeleton-text>
      <ion-card class="skeleton-card">
        <div class="skeleton-list-item" *ngFor="let sk of [1,2,3,4,5]">
          <div class="skeleton-lines">
            <ion-skeleton-text animated style="width: 32%; height: 14px;"></ion-skeleton-text>
          </div>
          <ion-skeleton-text animated style="width: 40%; height: 14px;"></ion-skeleton-text>
        </div>
      </ion-card>
    </div>
  </ng-container>

  <!-- Content -->
  <ng-container *ngIf="!isLoading">
  <section class="payment-summary">
    <div class="summary-label">待支付费用</div>
    <div class="summary-amount">
      <span>￥</span>
      <strong>{{weightBill.Amount}}</strong>
    </div>
    <p>请核对车辆与费用信息后继续支付</p>
  </section>

  <section class="payment-card">
    <div class="payment-card-title">过磅信息</div>
    <div class="detail-row highlight">
      <span>车牌号码</span>
      <strong>{{weightBill?.VehicleNo || '-'}}</strong>
    </div>
    <div class="detail-grid">
      <div>
        <span>皮重(车重)</span>
        <strong>{{weightBill?.TareWeight}}KG</strong>
      </div>
      <div>
        <span>过磅费</span>
        <strong>{{weightBill?.WeighingFee}}元</strong>
      </div>
    </div>
    <div class="detail-row">
      <span>月卡用户</span>
      <strong>{{weightBill?.IsMonthly || '-'}}</strong>
    </div>
    <div class="detail-row">
      <span>企业账号</span>
      <strong>{{weightBill?.CorporateAccount || '-'}}</strong>
    </div>
  </section>
  </ng-container>

</ion-content>
<ion-footer class="payment-footer">
  <ion-button expand="block" (click)="payByJsApi()"  [disabled]="!signalRConnected">支付费用</ion-button>
</ion-footer>
