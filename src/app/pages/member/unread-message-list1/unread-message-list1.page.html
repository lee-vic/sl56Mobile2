<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>单号消息</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="waybill-message-content">
  <ng-container *ngIf="isLoading">
    <section class="waybill-message-panel loading-panel" *ngFor="let _ of loadingPlaceholders">
      <ion-list lines="none" class="waybill-message-list">
        <ion-item>
          <ion-label>
            <ion-skeleton-text animated style="width: 42%"></ion-skeleton-text>
          </ion-label>
          <ion-note slot="end">
            <ion-skeleton-text animated style="width: 72px"></ion-skeleton-text>
          </ion-note>
        </ion-item>
        <ion-item>
          <ion-label>
            <ion-skeleton-text animated style="width: 92%"></ion-skeleton-text>
          </ion-label>
          <ion-badge slot="end" class="placeholder-badge">--</ion-badge>
        </ion-item>
      </ion-list>
    </section>
  </ng-container>

  <section class="waybill-message-panel" *ngFor="let item of items">
    <button type="button" class="message-card" (click)="detail(item)">
      <span class="message-icon" [class.has-unread]="item.Count > 0" aria-hidden="true">
        <ion-icon [name]="item.Count > 0 ? 'mail-unread-outline' : 'chatbubble-ellipses-outline'"></ion-icon>
      </span>

      <div class="message-title-wrap">
        <h2>{{ item.ObjectNo }}</h2>
        <div class="message-meta">
          <span class="message-time">{{ item.Time || '最近联系' }}</span>
          <span class="unread-pill" *ngIf="item.Count > 0">
            <ion-badge color="danger">{{ item.Count }}</ion-badge>
            条未读
          </span>
          <span class="recent-note" *ngIf="!item.Count">{{ item.IsRecent ? '最近' : '已读' }}</span>
        </div>
      </div>

      <ion-icon name="chevron-forward-outline" class="message-chevron" aria-hidden="true"></ion-icon>

      <p class="message-preview" [class.is-empty]="!item.Content">{{ item.Content || '暂无最近消息' }}</p>
    </button>
  </section>

  <section class="waybill-empty" *ngIf="!isLoading && loadError">
    <p>加载失败</p>
    <ion-button fill="outline" size="small" (click)="getData()">重新加载</ion-button>
  </section>

  <section class="waybill-empty" *ngIf="!isLoading && !loadError && items.length === 0">
    <p>暂无单号消息记录</p>
  </section>
</ion-content>
