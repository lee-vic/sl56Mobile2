<ion-header translucent="true" class="history-header">
  <ion-toolbar>
    <ion-title>历史提货人</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">关闭</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="search-toolbar">
    <ion-searchbar
      [value]="searchKeyword"
      placeholder="搜索姓名或手机号"
      showClearButton="focus"
      autocomplete="off"
      aria-label="搜索历史提货人"
      (ionInput)="onSearchInput($event)"
      (ionClear)="clearSearch()">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" class="history-content">
  <section class="history-intro">
    <h2>选择常用提货人</h2>
    <p>选中后会自动填入申请表单。</p>
  </section>

  <ion-list class="history-list" lines="none" *ngIf="showSkeleton" aria-label="历史提货人加载中">
    <ion-item class="history-item skeleton-item" *ngFor="let item of skeletonRows">
      <ion-skeleton-text animated class="avatar-skeleton" slot="start"></ion-skeleton-text>
      <ion-label>
        <ion-skeleton-text animated class="name-skeleton"></ion-skeleton-text>
        <ion-skeleton-text animated class="phone-skeleton"></ion-skeleton-text>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="state-wrap" *ngIf="isLoaded && hasLoadError">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p class="state-title">历史记录加载失败</p>
    <p class="state-subtitle">网络或服务暂时不可用，请稍后重试。</p>
    <ion-button size="small" fill="outline" (click)="loadHistory()">重新加载</ion-button>
  </div>

  <div class="state-wrap" *ngIf="isLoaded && !hasLoadError && filteredItems.length === 0">
    <ion-icon name="person-circle-outline"></ion-icon>
    <p class="state-title">{{searchKeyword ? '未找到匹配提货人' : '暂无历史提货人'}}</p>
    <p class="state-subtitle">{{searchKeyword ? '可以更换关键词或清空搜索。' : '提交过退货申请后，这里会保存常用提货人。'}}</p>
    <ion-button *ngIf="searchKeyword" size="small" fill="outline" (click)="clearSearch()">清空搜索</ion-button>
  </div>

  <ion-radio-group [value]="currentItem" (ionChange)="onSelectionChange($event)" *ngIf="isLoaded && !hasLoadError && filteredItems.length > 0">
    <ion-list class="history-list" lines="none">
      <ion-item button detail="false" class="history-item" *ngFor="let item of filteredItems" (click)="chooseContact(item)">
        <div slot="start" class="contact-avatar">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <ion-label>
          <h3>{{item.personName || '--'}}</h3>
          <p>{{item.mobilePhone || '--'}}</p>
        </ion-label>
        <ion-radio slot="end" [value]="item.raw" aria-label="选择历史提货人"></ion-radio>
      </ion-item>
    </ion-list>
  </ion-radio-group>
</ion-content>

<ion-footer class="history-footer">
  <ion-toolbar>
    <ion-button expand="block" (click)="select()" [disabled]="!selectedContact">确定</ion-button>
  </ion-toolbar>
</ion-footer>
