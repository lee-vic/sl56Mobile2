<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>公告详情</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="notice-detail-content">
  <section class="notice-detail-card skeleton-card" *ngIf="isLoading" aria-live="polite" aria-busy="true">
    <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
    <ion-skeleton-text animated class="skeleton-meta"></ion-skeleton-text>
    <div class="notice-divider"></div>
    <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
    <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
    <ion-skeleton-text animated class="skeleton-line short"></ion-skeleton-text>
  </section>

  <ion-card class="notice-detail-state ion-no-margin" *ngIf="loadError && !isLoading">
    <ion-card-content>
      <ion-icon name="cloud-offline-outline" aria-hidden="true"></ion-icon>
      <h2>公告详情加载失败</h2>
      <p>请检查网络后重试。</p>
      <ion-button fill="outline" size="small" (click)="loadDetail()">重新加载</ion-button>
    </ion-card-content>
  </ion-card>

  <section class="notice-detail-card" *ngIf="notice && !isLoading && !loadError">
    <h1>{{ notice?.Title }}</h1>
    <p class="notice-meta">发表于 {{ notice?.CreateAt }}</p>
    <div class="notice-divider"></div>
    <div class="notice-body" [innerHTML]="notice?.Summary"></div>
  </section>

  <ion-card class="notice-detail-state ion-no-margin" *ngIf="isLoaded && !notice && !isLoading && !loadError">
    <ion-card-content>
      <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
      <h2>公告内容已失效</h2>
      <p>这条公告暂时无法查看，请返回列表选择其他公告。</p>
    </ion-card-content>
  </ion-card>
</ion-content>
