<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>模板下载</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="template-page">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content pullingText="下拉刷新" refreshingSpinner="crescent" refreshingText="正在刷新"></ion-refresher-content>
  </ion-refresher>

  <section class="page-intro">
    <div class="intro-icon">
      <ion-icon name="download-outline"></ion-icon>
    </div>
    <div>
      <h1>业务模板</h1>
      <p>下载常用模板后按要求填写，可减少资料返工。</p>
    </div>
  </section>

  <section class="template-list skeleton-list" *ngIf="isInitialLoading" aria-label="加载中">
    <ion-card class="template-card ion-no-margin" *ngFor="let item of [1,2,3,4]">
      <ion-card-content>
        <ion-skeleton-text animated class="skeleton-icon"></ion-skeleton-text>
        <div>
          <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        </div>
      </ion-card-content>
    </ion-card>
  </section>

  <section class="state-wrap" *ngIf="isLoaded && loadError && items.length === 0">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <h2>模板加载失败</h2>
    <p>网络可能不稳定，请稍后重试。</p>
    <ion-button fill="outline" size="small" (click)="refreshList()">重新加载</ion-button>
  </section>

  <section class="state-wrap" *ngIf="isLoaded && !loadError && items.length === 0">
    <ion-icon name="file-tray-outline"></ion-icon>
    <h2>暂无可下载模板</h2>
    <p>有新模板时会在这里展示。</p>
  </section>

  <section class="template-list" *ngIf="items.length > 0">
    <ion-card class="template-card ion-no-margin" *ngFor="let item of items; trackBy: trackByTemplateId">
      <ion-card-content>
        <span class="template-icon">
          <ion-icon name="document-text-outline"></ion-icon>
        </span>
        <ion-label>
          <h2>{{item.Name}}</h2>
          <p>{{item.Remark || '下载后按模板填写业务资料'}}</p>
        </ion-label>
        <ion-button [href]="item.Url" fill="clear" size="small" aria-label="下载模板">
          <ion-icon slot="icon-only" name="download-outline"></ion-icon>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </section>

  <ion-infinite-scroll (ionInfinite)="getItems($event)" [disabled]="loadError">
    <ion-infinite-scroll-content loadingSpinner="dots" loadingText="加载更多..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
