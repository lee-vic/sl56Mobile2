<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>香港入仓申请</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="warehouse-page">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content pullingText="下拉刷新申请" refreshingSpinner="crescent" refreshingText="正在刷新..."></ion-refresher-content>
  </ion-refresher>

  <section class="warehouse-intro">
    <div class="intro-icon" aria-hidden="true">
      <ion-icon name="business-outline"></ion-icon>
    </div>
    <div>
      <h1>香港仓库入仓</h1>
      <p>用于直接交货到我司香港仓库的入仓申请。</p>
    </div>
  </section>

  <section class="application-list" *ngIf="isInitialLoading" aria-live="polite" aria-busy="true">
    <ion-card class="application-card skeleton-card ion-no-margin" *ngFor="let item of [1,2,3]">
      <ion-card-content>
        <div class="skeleton-head">
          <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-badge"></ion-skeleton-text>
        </div>
        <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        <ion-skeleton-text animated class="skeleton-line short"></ion-skeleton-text>
        <ion-skeleton-text animated class="skeleton-action"></ion-skeleton-text>
      </ion-card-content>
    </ion-card>
  </section>

  <ion-card class="state-card ion-no-margin" *ngIf="loadError && !isInitialLoading">
    <ion-card-content>
      <ion-icon name="cloud-offline-outline" aria-hidden="true"></ion-icon>
      <h2>申请列表加载失败</h2>
      <p>请检查网络后重试。</p>
      <ion-button fill="outline" size="small" (click)="refreshList()">重新加载</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card class="state-card ion-no-margin" *ngIf="isLoaded && !isInitialLoading && !loadError && applications.length === 0">
    <ion-card-content>
      <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
      <h2>暂无入仓申请</h2>
      <p>新增申请后，可在这里查看状态、费用和支付入口。</p>
      <ion-button size="small" (click)="add()">新增申请</ion-button>
    </ion-card-content>
  </ion-card>

  <section class="application-list" *ngIf="!isInitialLoading && !loadError && applications.length > 0">
    <ion-card class="application-card ion-no-margin" *ngFor="let app of applications; trackBy: trackByApplicationId" button (click)="goToDetail(app.Id)">
      <ion-card-header>
        <div>
          <ion-card-subtitle>入仓单号</ion-card-subtitle>
          <ion-card-title>{{ app.ReferenceNumber }}</ion-card-title>
        </div>
        <ion-badge [color]="getStatusMeta(app.Status).color">{{ getStatusMeta(app.Status).label }}</ion-badge>
      </ion-card-header>

      <ion-card-content>
        <div class="application-meta">
          <div>
            <span>件数</span>
            <strong>{{ app.Piece }}</strong>
          </div>
          <div>
            <span>送货方式</span>
            <strong>{{ app.Source || '--' }}</strong>
          </div>
          <div>
            <span>费用</span>
            <strong>HK$ {{ app.Amount || 0 }}</strong>
          </div>
        </div>

        <div class="application-actions">
          <ion-button fill="clear" size="small">
            查看详情
            <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
          </ion-button>
          <ion-button *ngIf="app.Status === 0" size="small" (click)="pay(app); $event.stopPropagation()">
            <ion-icon slot="start" name="wallet-outline"></ion-icon>
            支付
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </section>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="正在加载更多..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <p *ngIf="!hasMore && applications.length > 0" class="no-more-tip">没有更多申请了</p>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button aria-label="新增入仓申请" (click)="add()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
